<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch and Display api Data. </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Task Explorer</h1>

        <button id="fetchBtn">Fetch Tasks</button>

        <div id="filters">
            <button id="allBtn">All Tasks</button>
            <button id="finishedBtn">Finished</button>
            <button id="pendingBtn">Pending</button>
        </div>

        <p id="status"></p>

        <div id="taskContainer"></div>

        <p id="finalMessage"></p>
    </main>
</body>
</html>
